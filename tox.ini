# Tox configuration file
# Read more under https://tox.wiki/

[tox]
minversion = 3.24
envlist = default
isolated_build = True


[testenv:.pkg]
# Forward setuptools_scm vars (e.g. SETUPTOOLS_SCM_PRETEND_VERSION*) into the
# isolated package-build env, where the version is actually computed.
passenv =
    SETUPTOOLS_*


[testenv]
description = Invoke pytest to run automated tests
setenv =
    TOXINIDIR = {toxinidir}
    # Several extractors and journal tests compare naive timestamps parsed from
    # the sample files, so the suite only passes in a UTC runner.
    TZ = UTC
passenv =
    HOME
    SETUPTOOLS_*
extras =
    testing
commands =
    pytest \
        --junitxml=pytest-report.xml \
        --cov-report=xml:coverage.xml {posargs}


[testenv:{build,clean}]
description =
    build: Build the package in isolation according to PEP517, see https://github.com/pypa/build
    clean: Remove old distribution files and temporary build artifacts (./build and ./dist)
# https://setuptools.pypa.io/en/stable/build_meta.html#how-to-use-it
skip_install = True
changedir = {toxinidir}
deps =
    build: build[virtualenv]
passenv =
    SETUPTOOLS_*
commands =
    clean: python -c 'import shutil; [shutil.rmtree(p, True) for p in ("build", "dist")]'
    clean: python -c 'import pathlib, shutil; [shutil.rmtree(p, True) for p in pathlib.Path("src").glob("*.egg-info")]'
    build: python -m build {posargs}
# By default, both `sdist` and `wheel` are built. Run `tox -e build -- --wheel` for wheel only.


[testenv:{docs,doctests,linkcheck}]
description =
    docs: Invoke sphinx-build to build the docs
    doctests: Invoke sphinx-build to run doctests
    linkcheck: Check for broken links in the documentation
passenv =
    SETUPTOOLS_*
setenv =
    DOCSDIR = {toxinidir}/docs
    BUILDDIR = {toxinidir}/docs/_build
    docs: BUILD = html
    doctests: BUILD = doctest
    linkcheck: BUILD = linkcheck
deps =
    -r {toxinidir}/docs/requirements.txt
    # ^  requirements.txt shared with Read The Docs
commands =
    sphinx-build --color -b {env:BUILD} -d "{env:BUILDDIR}/doctrees" "{env:DOCSDIR}" "{env:BUILDDIR}/{env:BUILD}" {posargs}


[testenv:sbom]
description =
    Generate a CycloneDX SBOM for an installed package environment.
    Pass the path to a virtualenv that already has the package installed as
    posargs so resolved runtime deps are captured: `tox -e sbom -- .sbom-venv`.
    With no posargs it scans the current interpreter.
    Output: sbom-python.cdx.json (CycloneDX JSON).
skip_install = True
changedir = {toxinidir}
deps = cyclonedx-bom
commands =
    cyclonedx-py environment {posargs} --output-format JSON --output-file sbom-python.cdx.json


[testenv:publish]
description =
    Publish the package you have been developing to a package index server.
    By default, it uses testpypi. If you really want to publish your package
    to be publicly accessible in PyPI, use the `-- --repository pypi` option.
skip_install = True
changedir = {toxinidir}
passenv =
    # See: https://twine.readthedocs.io/en/latest/
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY
    TWINE_REPOSITORY_URL
deps = twine
commands =
    python -m twine check dist/*
    python -m twine upload {posargs:--repository {env:TWINE_REPOSITORY:testpypi}} dist/*
